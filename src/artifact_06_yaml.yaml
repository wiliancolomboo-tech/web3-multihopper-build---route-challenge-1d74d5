version: "3.9"

services:
  multihopper-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper-worker
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - SOLANA_WS_URL=wss://api.mainnet-beta.solana.com
      - SLACK_WEBHOOK_URL=https://example.com/webhook/slack-placeholder
      - RESEND_API_KEY=re_live_ActualEnterpriseKeyHere
      - AUDIT_EMAIL=settlement@fund.enterprise.com
      - METRICS_PORT=9090
      - HEALTH_PORT=8080
    ports:
      - "8080:8080" # Health endpoint
      - "9090:9090" # Prometheus metrics
    networks:
      - hopper-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: multihopper-prom
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"
    networks:
      - hopper-net

networks:
  hopper-net:
    driver: bridge