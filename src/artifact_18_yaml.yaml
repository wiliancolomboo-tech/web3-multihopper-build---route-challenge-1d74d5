version: '3.8'

services:
  multihopper-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - OPERATIONAL_WEBHOOK_URL=https://example.com/webhook/discord-placeholder
      - RESEND_API_KEY=re_test_000000000000000000000000
      - OPERATIONS_EMAIL=ops@multihopper.fi
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"