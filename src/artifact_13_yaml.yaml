version: "3.9"

services:
  multihopper-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RECEIPT_RECIPIENT_EMAIL=${RECEIPT_RECIPIENT_EMAIL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"