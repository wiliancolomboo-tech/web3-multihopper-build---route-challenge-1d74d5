version: "3.8"

services:
  multihopper-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - SIGNER_SECRET_KEY=${SIGNER_SECRET_KEY}
      - ROUTER_PROGRAM_ID=MHopRouter1111111111111111111111111111111111
      - ENTERPRISE_WEBHOOK_URL=${ENTERPRISE_WEBHOOK_URL}
    healthcheck:
      test: ["CMD-SHELL", "node -e 'console.log(\"healthy\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"