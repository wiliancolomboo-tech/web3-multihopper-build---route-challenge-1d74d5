version: "3.8"

services:
  multihopper-routing-node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper-routing-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - SOLANA_WS_URL=wss://api.mainnet-beta.solana.com
      - KEYPAIR_PATH=/secrets/operator-keypair.json
      - SLACK_WEBHOOK_URL=https://example.com/webhook/slack-placeholder
      - RESEND_API_KEY=re_your_enterprise_api_key
      - METRICS_PORT=8080
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3