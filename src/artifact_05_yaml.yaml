version: "3.8"

services:
  multihopper-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper-engine
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - MULTI_HOPPER_PROGRAM_ID=MHopRouter1111111111111111111111111111111111
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUDIT_EMAIL_RECIPIENT=${AUDIT_EMAIL_RECIPIENT}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3