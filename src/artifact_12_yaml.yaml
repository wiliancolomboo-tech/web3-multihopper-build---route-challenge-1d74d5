version: '3.8'

services:
  multihopper-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper-node
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - PROGRAM_ID=${PROGRAM_ID:-MHop111111111111111111111111111111111111111}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - AUDIT_ALERT_EMAIL=${AUDIT_ALERT_EMAIL:-treasury@multihopper.fi}
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"