version: '3.8'

services:
  multihopper-routing-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - MULTIHOPPER_PROGRAM_ID=HoppER1111111111111111111111111111111111111
      - PRIVATE_KEY=[1,2,3...255]
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/your-enterprise-id
      - RESEND_API_KEY=re_enterprise_key_987654321
      - ALERT_EMAIL_RECIPIENT=defi-monitoring@multihopper.fi
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"