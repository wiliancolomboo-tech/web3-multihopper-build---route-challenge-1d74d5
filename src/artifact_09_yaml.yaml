version: '3.8'

services:
  multihopper-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - JITO_BLOCK_ENGINE_URL=https://mainnet.block-engine.jito.wtf
      - KEYPAIR_PATH=/secrets/id.json
      - ALERT_WEBHOOK_URL=https://example.com/webhook/discord-placeholder
      - METRICS_PORT=8080
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s