version: '3.8'

services:
  multihopper-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper-engine
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - ROUTER_SIGNER_KEYPAIR=${ROUTER_SIGNER_KEYPAIR}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ENTERPRISE_WEBHOOK_URL=${ENTERPRISE_WEBHOOK_URL}
      - TEST_COMPLIANCE_EMAIL=${TEST_COMPLIANCE_EMAIL}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"