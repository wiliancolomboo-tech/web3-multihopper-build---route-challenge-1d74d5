version: "3.8"

services:
  multihopper-solver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper-solver
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      - ROUTER_PROGRAM_ID=${ROUTER_PROGRAM_ID:-HopRouter1111111111111111111111111111111111}
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL}
      - METRICS_PORT=9100
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"