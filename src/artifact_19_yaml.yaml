version: '3.8'

services:
  multihopper-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multihopper_router_service
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - DISCORD_WEBHOOK_URL=https://example.com/webhook/discord-placeholder
      - RESEND_API_KEY=re_placeholder_secret_key
      - ADMIN_ALERT_EMAIL=partners@multihopper.io
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 5s
      retries: 3