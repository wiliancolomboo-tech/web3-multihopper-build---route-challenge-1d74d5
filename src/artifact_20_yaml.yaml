version: "3.8"

services:
  multihopper-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - ALERT_WEBHOOK_URL=https://example.com/webhook/discord-placeholder
      - RESEND_API_KEY=re_test_000000000000000000000000
      - ALERT_RECIPIENT_EMAIL=settlement@multihopper.io
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3